server {
    listen 80;
    server_name _;

    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        audio/mpeg                            mp3;
    }

    root /srv/public-rw;
    index index.html;

    charset utf-8;
    disable_symlinks off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/csv;
    gzip_min_length 1024;

    location = /content/transcripcion.csv {
        alias /srv/content/transcripcion.csv;
        add_header Cache-Control "no-cache";
        default_type text/csv;
    }

    location = /content/intro.txt {
        alias /srv/content/intro.txt;
        add_header Cache-Control "no-cache";
        default_type text/html;
    }

    location /content/sounds/ {
        alias /srv/content/sounds/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        default_type audio/mpeg;
    }

    location ~* \.(js|css|html|svg)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
