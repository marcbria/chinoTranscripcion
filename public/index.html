<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diccionario de transcripciones del chino</title>

  <!-- Fija la resolución de todas las rutas relativas contra el subpath
       público. Imprescindible detrás de Traefik con StripPrefix cuando
       se sirve bajo un subdirectorio (p. ej. /es/transcripciones/). -->
  <base href="__BASE_PATH__">

  <!-- Favicon vacío para evitar el 404 de /favicon.ico -->
  <link rel="icon" href="data:," />

  <!-- Los ?v=__*_HASH__ se sustituyen en el entrypoint por el hash
       del fichero correspondiente, para forzar cache-busting real
       en el navegador cuando el contenido cambia. -->
  <link rel="stylesheet" href="./styles.css?v=__CSS_HASH__" />
  <link rel="stylesheet" href="./theme/uab/css/header-styles.css?v=__THEME_HASH__" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>

  <!-- ═══════════ HEADER TEMA UAB ═══════════ -->
  <div class="uab-header-wrapper">

    <div id="prenavigation" class="prenavigation">
      <div class="container">
        <section class="region region-prenavigation">

          <div class="item directori">
            <span class="prenav dir"><a href="/directori">Directori</a></span>
          </div>

          <nav class="links nav links-inline" aria-label="Selector de idioma">
            <span class="prenav-lang-item ca" data-lang="ca">
              <a href="?lang=ca" hreflang="ca">Català</a>
            </span>
            <span class="prenav-lang-item es active" data-lang="es">
              <a href="?lang=es" hreflang="es">Español</a>
            </span>
            <span class="prenav-lang-item en" data-lang="en">
              <a href="?lang=en" hreflang="en">English</a>
            </span>
          </nav>

          <div class="social-links">
            <a href="https://www.instagram.com/publicacionsuab/"
               target="_blank" rel="noopener" title="Instagram" aria-label="Instagram">
              <img src="./theme/uab/img/social/instagram.svg"
                   alt="Instagram" width="22" height="22"
                   decoding="async" />
            </a>
            <a href="https://bsky.app/profile/publicacionsuab.bsky.social"
               target="_blank" rel="noopener" title="Bluesky" aria-label="Bluesky">
              <img src="./theme/uab/img/social/bluesky.svg"
                   alt="Bluesky" width="22" height="22"
                   decoding="async" />
            </a>
            <a href="mailto:sp@uab.cat" title="Mail" aria-label="Correo electrónico">
              <img src="./theme/uab/img/social/mail.svg"
                   alt="Correo electrónico" width="22" height="22"
                   decoding="async" />
            </a>
          </div>

        </section>
      </div>
    </div>

    <header class="navbar" id="navbar-main" role="banner">
      <div class="container">
        <div class="navbar-brand">
          <a href="https://publicacions.uab.cat/" title="Publicacions UAB">
            <img src="./theme/uab/img/logo.webp"
                 alt="Universitat Autònoma de Barcelona"
                 loading="eager" decoding="async" />
          </a>
        </div>

        <button class="navbar-toggler" type="button" aria-label="Toggle navigation"
                onclick="document.getElementById('navbar-collapse').classList.toggle('show')">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div id="navbar-collapse" class="navbar-collapse">
          <ul class="navbar-nav">
            <li class="prenav-menu-item">
              <a href="/servei/presentacio" class="nav-link">El Servei</a>
            </li>
            <li class="prenav-menu-item active">
              <a href="#" class="nav-link" title="Libros">Libros</a>
            </li>
            <li class="prenav-menu-item">
              <a href="/revistes" class="nav-link" title="Revistas científicas">Revistas</a>
            </li>
            <li class="prenav-menu-item">
              <a href="/altres-productes-activitats" class="nav-link" title="Otros servicios">Otros</a>
            </li>
          </ul>
        </div>
      </div>
    </header>
  </div>

  <!-- ═══════════ CONTENIDO PRINCIPAL ═══════════ -->

  <header class="page-header">
    <div class="container">
      <h1>Correspondencias entre transcripciones del repertorio silábico chino</h1>
      <section id="intro-content" class="intro" aria-live="polite">
        Cargando introducción…
      </section>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="controls">
        <div class="global-filter">
          <label for="global-filter-input">Búsqueda global:</label>
          <input
            type="text"
            id="global-filter-input"
            placeholder="Buscar…"
            autocomplete="off"
          />
          <span class="global-filter-icon" aria-hidden="true">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
        </div>
        <button id="clear-all-filters" class="secondary">Resetear filtros</button>
      </section>

      <section class="counter" id="counter">Mostrando 0 de 0 resultados</section>

      <div class="table-wrapper" id="table-wrapper">
        <table id="dictionary-table">
          <thead>
            <tr id="header-row"></tr>
            <tr id="filter-row"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div id="loading-indicator" class="hidden">
          <i class="fa-solid fa-spinner fa-spin"></i> Cargando más resultados…
        </div>
        <div id="end-of-list" class="hidden">— Fin de los resultados —</div>
      </div>
    </div>
  </main>

  <script src="./app.js?v=__JS_HASH__"></script>
</body>
</html>
